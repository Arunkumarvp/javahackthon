# ─────────────────────────────────────────────────────────────────────────────
# Supabase Profile — AI Financial Guardian
# ─────────────────────────────────────────────────────────────────────────────
# Activate with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=supabase
# OR set environment variable:
#   SPRING_PROFILES_ACTIVE=supabase
#
# All secrets are read from environment variables — never hardcoded here.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:postgresql://db.ksfpletohhmqjdzzuwmv.supabase.co:5432/postgres?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      # Supabase enforces a connection limit — keep pool small for free-tier
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      # 'update' safely creates/alters tables without dropping existing data
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        # Supabase uses Postgres — enable batch inserts for performance
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Disable H2 console — not applicable for PostgreSQL profile
  h2:
    console:
      enabled: false

logging:
  level:
    com.hackathon.aiguardian: INFO
    org.springframework.security: WARN
    # Enable SQL logging only for debugging
    org.hibernate.SQL: WARN
