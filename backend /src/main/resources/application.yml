spring:
  application:
    name: ai-guardian-backend

  # ─── Datasource ─────────────────────────────────────────────────────────────
  # Default: H2 in-memory for instant local startup.
  # For production: set DATABASE_URL to your Neon/Supabase PostgreSQL connection string.
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:aiguardiandb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

  # ─── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true
    open-in-view: false

  # ─── H2 Console (dev only) ───────────────────────────────────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console

# ─── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# ─── OpenRouter LLM ───────────────────────────────────────────────────────────
openrouter:
  api-key: ${OPENROUTER_API_KEY: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}
  backup-key: ${OPENROUTER_BACKUP_KEY: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}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  model: ${OPENROUTER_MODEL:nvidia/nemotron-3-super-120b-a12b:free}
  timeout-ms: ${OPENROUTER_TIMEOUT_MS:30000}
  app-url: ${APP_URL:http://localhost:8080}


# ─── Weaviate Vector Database ────────────────────────────────────────────────
weaviate:
  url: ${WEAVIATE_URL:http://localhost:8085}
  class-name: ${WEAVIATE_CLASS_NAME:KnowledgeChunk}
  enabled: ${WEAVIATE_ENABLED:true}

# ─── RAG Service ──────────────────────────────────────────────────────────────
rag:
  service-url: ${RAG_SERVICE_URL:http://localhost:8001}


# ─── Banfico Mock Bank API ───────────────────────────────────────────────────
banfico:
  domain: ${BANFICO_DOMAIN:obiebank-sbx.banfico.io}
  tenant: ${BANFICO_TENANT:provider}
  client-id: ${BANFICO_CLIENT_ID:corebank-spa}
  client-secret: ${BANFICO_CLIENT_SECRET:corebank-spa-password}
  username: ${BANFICO_USERNAME:}
  password: ${BANFICO_PASSWORD:}
  account-id: ${BANFICO_ACCOUNT_ID:}
  enabled: ${BANFICO_ENABLED:false}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.hackathon.aiguardian: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %-36logger{36} — %msg%n"

