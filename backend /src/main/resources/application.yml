spring:
  application:
    name: ai-guardian-backend

  # ─── Datasource ─────────────────────────────────────────────────────────────
  # Default: H2 in-memory for instant local startup.
  # For production: set DATABASE_URL to your Neon/Supabase PostgreSQL connection string.
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:aiguardiandb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

  # ─── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true
    open-in-view: false

  # ─── H2 Console (dev only) ───────────────────────────────────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console

# ─── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# ─── OpenRouter LLM ───────────────────────────────────────────────────────────
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  model: ${OPENROUTER_MODEL:anthropic/claude-3.5-sonnet}
  timeout-ms: ${OPENROUTER_TIMEOUT_MS:30000}
  app-url: ${APP_URL:http://localhost:8080}

# ─── RAG Service ──────────────────────────────────────────────────────────────
rag:
  service-url: ${RAG_SERVICE_URL:http://localhost:8001}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.hackathon.aiguardian: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %-36logger{36} — %msg%n"
